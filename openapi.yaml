openapi: "3.1.0"
info:
  title: ezBookkeeping API
  description: |
    ezBookkeeping is a lightweight, self-hosted personal finance app. This document describes its REST API and MCP (Model Context Protocol) endpoints.

    ## Authentication
    - **JWT Bearer Token**: Most `/api/v1/` endpoints require a valid JWT token passed via `Authorization: Bearer <token>` header.
    - **API/MCP Token**: Tokens generated via `/api/v1/tokens/generate/api.json` or `/api/v1/tokens/generate/mcp.json` can be used for API/MCP access.
    - **Cookie-based auth**: Used by browser clients.

    ## Response Format
    All REST API responses follow a standard envelope:
    ```json
    {
      "success": true|false,
      "result": { ... },         // on success
      "errorCode": 200001,       // on error
      "errorMessage": "...",     // on error
      "path": "/api/..."         // on error
    }
    ```

    ## Error Codes
    Errors follow the format: `category * 100000 + subCategory * 1000 + index`
    - System errors: `1xxxxx`
    - Normal errors: `2xxxxx`
    - Sub-categories: 0=Global, 1=User, 2=Token, 3=2FA, 4=Account, 5=Transaction, 6=Category, 7=Tag, 8=Data, 14=MCP, 15=LLM, etc.

    ## Transaction Types
    - `1` = Modify Balance
    - `2` = Income
    - `3` = Expense
    - `4` = Transfer

    ## Account Categories
    - `1` = Cash, `2` = Checking, `3` = Credit Card, `4` = Virtual
    - `5` = Debt, `6` = Receivables, `7` = Investment, `8` = Savings, `9` = Certificate of Deposit

    ## Category Types
    - `1` = Income, `2` = Expense, `3` = Transfer
  version: "1.0.0"
  contact:
    name: ezBookkeeping
    url: "https://github.com/mayswind/ezbookkeeping"

servers:
  - url: "http://localhost:8080"
    description: Local development server

tags:
  - name: Auth
    description: Authentication and authorization
  - name: Users
    description: User profile management
  - name: Tokens
    description: Token management (API/MCP tokens, token list, refresh, revoke)
  - name: Accounts
    description: Account management (two-level: parent and sub-accounts)
  - name: Transactions
    description: Transaction CRUD, search, statistics, batch operations, import/export
  - name: Transaction Categories
    description: Two-level transaction categories (income/expense/transfer)
  - name: Transaction Tags
    description: Tag management
  - name: Transaction Tag Groups
    description: Tag group management
  - name: Transaction Templates
    description: Normal and scheduled transaction templates
  - name: Transaction Pictures
    description: Upload and manage transaction picture attachments
  - name: Insights Explorers
    description: Saved insights/chart explorer configurations
  - name: Exchange Rates
    description: Latest exchange rates and user custom rates
  - name: Data Management
    description: Data statistics, clear, export
  - name: Two-Factor Auth
    description: Two-factor authentication (2FA) management
  - name: External Auth
    description: OIDC / OAuth 2.0 external authentication
  - name: Application Cloud Settings
    description: Sync user app settings across devices
  - name: LLM
    description: AI-powered receipt image recognition
  - name: MCP
    description: Model Context Protocol server endpoints
  - name: System
    description: Health check, version, server settings
  - name: Password Reset
    description: Forget/reset password flow

security:
  - BearerAuth: []

paths:
  # ====================================================================
  #  System / Public Endpoints
  # ====================================================================
  /healthz.json:
    get:
      tags: [System]
      summary: Health check
      description: Returns server health status. Available without authentication.
      security: []
      responses:
        "200":
          description: Server is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /server_settings.js:
    get:
      tags: [System]
      summary: Get server settings as JavaScript
      description: Returns server-side settings as a JavaScript file for the frontend.
      security: []
      responses:
        "200":
          description: JavaScript file with server settings
          content:
            text/javascript:
              schema:
                type: string

  /api/systems/version.json:
    get:
      tags: [System]
      summary: Get server version
      description: Returns the current server version information.
      responses:
        "200":
          description: Version info
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      result:
                        type: object
                        properties:
                          version:
                            type: string
                          commitHash:
                            type: string
                          buildTime:
                            type: string

  # ====================================================================
  #  Authentication Endpoints (no BearerAuth required)
  # ====================================================================
  /api/authorize.json:
    post:
      tags: [Auth]
      summary: Login / authorize
      description: Login with username/email and password. Returns a JWT token on success.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserLoginRequest"
      responses:
        "200":
          description: Authorization successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      result:
                        $ref: "#/components/schemas/AuthResponse"

  /api/register.json:
    post:
      tags: [Auth]
      summary: Register a new user
      description: Register a new user account. Optionally allows batch creation of preset categories.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRegisterRequest"
      responses:
        "200":
          description: Registration successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      result:
                        $ref: "#/components/schemas/RegisterResponse"

  /api/logout.json:
    get:
      tags: [Auth]
      summary: Logout / revoke current token
      description: Revokes the current JWT token.
      responses:
        "200":
          description: Logout successful

  # ====================================================================
  #  2FA Endpoints (requires 2FA intermediate token)
  # ====================================================================
  /api/2fa/authorize.json:
    post:
      tags: [Auth]
      summary: Complete 2FA login
      description: Submit TOTP passcode to complete two-factor authentication login.
      security: [] # Uses 2FA intermediate token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TwoFactorLoginRequest"
      responses:
        "200":
          description: 2FA authorization successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      result:
                        $ref: "#/components/schemas/AuthResponse"

  /api/2fa/recovery.json:
    post:
      tags: [Auth]
      summary: 2FA recovery code login
      description: Login using a 2FA recovery code.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TwoFactorRecoveryCodeLoginRequest"
      responses:
        "200":
          description: Recovery authorization successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      result:
                        $ref: "#/components/schemas/AuthResponse"

  # ====================================================================
  #  OAuth2 / OIDC Endpoints (no BearerAuth)
  # ====================================================================
  /oauth2/login:
    get:
      tags: [External Auth]
      summary: Initiate OAuth2/OIDC login
      description: Redirects to the OAuth 2.0 provider's login page.
      security: []
      parameters:
        - name: platform
          in: query
          required: true
          schema:
            type: string
          description: OAuth2 platform identifier
        - name: client_session_id
          in: query
          required: true
          schema:
            type: string
        - name: token
          in: query
          schema:
            type: string
      responses:
        "302":
          description: Redirect to OAuth2 provider

  /oauth2/callback:
    get:
      tags: [External Auth]
      summary: OAuth2/OIDC callback
      description: Callback endpoint for the OAuth 2.0 provider after user authentication.
      security: []
      parameters:
        - name: state
          in: query
          schema:
            type: string
        - name: code
          in: query
          schema:
            type: string
        - name: error
          in: query
          schema:
            type: string
        - name: error_description
          in: query
          schema:
            type: string
      responses:
        "302":
          description: Redirect to frontend

  /api/oauth2/authorize.json:
    post:
      tags: [External Auth]
      summary: Finalize OAuth2 callback login
      description: Complete OAuth2 login after callback verification. May require password or 2FA.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OAuth2CallbackLoginRequest"
      responses:
        "200":
          description: OAuth2 authorization successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      result:
                        $ref: "#/components/schemas/AuthResponse"

  # ====================================================================
  #  Email Verification Endpoints
  # ====================================================================
  /api/verify_email/resend.json:
    post:
      tags: [Auth]
      summary: Resend email verification (unauthenticated)
      description: Request a new email verification email.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserResendVerifyEmailRequest"
      responses:
        "200":
          description: Verification email resent

  /api/verify_email/by_token.json:
    post:
      tags: [Auth]
      summary: Verify email by token
      description: Verify email address using a verification token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserVerifyEmailRequest"
      responses:
        "200":
          description: Email verified
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      result:
                        $ref: "#/components/schemas/UserVerifyEmailResponse"

  # ====================================================================
  #  Password Reset Endpoints
  # ====================================================================
  /api/forget_password/request.json:
    post:
      tags: [Password Reset]
      summary: Request password reset
      description: Sends a password reset email to the specified email address.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgetPasswordRequest"
      responses:
        "200":
          description: Reset email sent

  /api/forget_password/reset/by_token.json:
    post:
      tags: [Password Reset]
      summary: Reset password by token
      description: Reset password using a reset token from email.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
      responses:
        "200":
          description: Password reset successful

  # ====================================================================
  #  Token Management
  # ====================================================================
  /api/v1/tokens/list.json:
    get:
      tags: [Tokens]
      summary: List all tokens
      description: Returns a list of all active tokens for the current user.
      responses:
        "200":
          description: Token list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      result:
                        $ref: "#/components/schemas/TokenInfoResponseSlice"

  /api/v1/tokens/generate/api.json:
    post:
      tags: [Tokens]
      summary: Generate API token
      description: Generate a new long-lived API token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenGenerateAPIRequest"
      responses:
        "200":
          description: API token generated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      result:
                        $ref: "#/components/schemas/TokenGenerateAPIResponse"

  /api/v1/tokens/generate/mcp.json:
    post:
      tags: [Tokens]
      summary: Generate MCP token
      description: Generate a new MCP (Model Context Protocol) access token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenGenerateMCPRequest"
      responses:
        "200":
          description: MCP token generated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      result:
                        $ref: "#/components/schemas/TokenGenerateMCPResponse"

  /api/v1/tokens/revoke.json:
    post:
      tags: [Tokens]
      summary: Revoke a specific token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRevokeRequest"
      responses:
        "200":
          description: Token revoked

  /api/v1/tokens/revoke_all.json:
    post:
      tags: [Tokens]
      summary: Revoke all tokens
      description: Revokes all tokens except the current one.
      responses:
        "200":
          description: All tokens revoked

  /api/v1/tokens/refresh.json:
    post:
      tags: [Tokens]
      summary: Refresh current token
      description: Refreshes the current JWT token, returning a new token and updated user info.
      responses:
        "200":
          description: Token refreshed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      result:
                        $ref: "#/components/schemas/TokenRefreshResponse"

  # ====================================================================
  #  User Profile
  # ====================================================================
  /api/v1/users/profile/get.json:
    get:
      tags: [Users]
      summary: Get user profile
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      result:
                        $ref: "#/components/schemas/UserProfileResponse"

  /api/v1/users/profile/update.json:
    post:
      tags: [Users]
      summary: Update user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserProfileUpdateRequest"
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      result:
                        $ref: "#/components/schemas/UserProfileUpdateResponse"

  /api/v1/users/avatar/update.json:
    post:
      tags: [Users]
      summary: Upload user avatar
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                avatar:
                  type: string
                  format: binary
      responses:
        "200":
          description: Avatar updated

  /api/v1/users/avatar/remove.json:
    post:
      tags: [Users]
      summary: Remove user avatar
      responses:
        "200":
          description: Avatar removed

  /api/v1/users/verify_email/resend.json:
    post:
      tags: [Users]
      summary: Resend email verification (authenticated)
      responses:
        "200":
          description: Verification email resent

  # ====================================================================
  #  External Auth (Authenticated)
  # ====================================================================
  /api/v1/users/external_auth/list.json:
    get:
      tags: [External Auth]
      summary: List external auth links
      responses:
        "200":
          description: External auth list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      result:
                        $ref: "#/components/schemas/UserExternalAuthInfoResponsesSlice"

  /api/v1/users/external_auth/unlink.json:
    post:
      tags: [External Auth]
      summary: Unlink external auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserExternalAuthUnlinkRequest"
      responses:
        "200":
          description: External auth unlinked

  # ====================================================================
  #  Application Cloud Settings
  # ====================================================================
  /api/v1/users/settings/cloud/get.json:
    get:
      tags: [Application Cloud Settings]
      summary: Get cloud application settings
      responses:
        "200":
          description: Application cloud settings
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      result:
                        $ref: "#/components/schemas/ApplicationCloudSettingSlice"

  /api/v1/users/settings/cloud/update.json:
    post:
      tags: [Application Cloud Settings]
      summary: Update cloud application settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserApplicationCloudSettingsUpdateRequest"
      responses:
        "200":
          description: Settings updated

  /api/v1/users/settings/cloud/disable.json:
    post:
      tags: [Application Cloud Settings]
      summary: Disable cloud application settings sync
      responses:
        "200":
          description: Cloud sync disabled

  # ====================================================================
  #  Two-Factor Authentication (Authenticated)
  # ====================================================================
  /api/v1/users/2fa/status.json:
    get:
      tags: [Two-Factor Auth]
      summary: Get 2FA status
      responses:
        "200":
          description: 2FA status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      result:
                        $ref: "#/components/schemas/TwoFactorStatusResponse"

  /api/v1/users/2fa/enable/request.json:
    post:
      tags: [Two-Factor Auth]
      summary: Request to enable 2FA
      description: Returns a TOTP secret and QR code for setup.
      responses:
        "200":
          description: 2FA enable request
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      result:
                        $ref: "#/components/schemas/TwoFactorEnableResponse"

  /api/v1/users/2fa/enable/confirm.json:
    post:
      tags: [Two-Factor Auth]
      summary: Confirm enable 2FA
      description: Confirms 2FA setup with a TOTP passcode.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TwoFactorEnableConfirmRequest"
      responses:
        "200":
          description: 2FA enabled
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      result:
                        $ref: "#/components/schemas/TwoFactorEnableConfirmResponse"

  /api/v1/users/2fa/disable.json:
    post:
      tags: [Two-Factor Auth]
      summary: Disable 2FA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TwoFactorDisableRequest"
      responses:
        "200":
          description: 2FA disabled

  /api/v1/users/2fa/recovery/regenerate.json:
    post:
      tags: [Two-Factor Auth]
      summary: Regenerate 2FA recovery codes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TwoFactorRegenerateRecoveryCodeRequest"
      responses:
        "200":
          description: Recovery codes regenerated

  # ====================================================================
  #  Data Management
  # ====================================================================
  /api/v1/data/statistics.json:
    get:
      tags: [Data Management]
      summary: Get data statistics
      description: Returns counts of accounts, categories, tags, transactions, pictures, explorers and templates.
      responses:
        "200":
          description: Data statistics
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      result:
                        $ref: "#/components/schemas/DataStatisticsResponse"

  /api/v1/data/clear/all.json:
    post:
      tags: [Data Management]
      summary: Clear all user data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClearDataRequest"
      responses:
        "200":
          description: All data cleared

  /api/v1/data/clear/transactions.json:
    post:
      tags: [Data Management]
      summary: Clear all transactions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClearDataRequest"
      responses:
        "200":
          description: Transactions cleared

  /api/v1/data/clear/transactions/by_account.json:
    post:
      tags: [Data Management]
      summary: Clear transactions by account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClearAccountTransactionsRequest"
      responses:
        "200":
          description: Account transactions cleared

  /api/v1/data/export.csv:
    get:
      tags: [Data Management]
      summary: Export data as CSV
      parameters:
        - $ref: "#/components/parameters/TransactionTypeFilter"
        - $ref: "#/components/parameters/CategoryIds"
        - $ref: "#/components/parameters/AccountIds"
        - $ref: "#/components/parameters/TagFilter"
        - $ref: "#/components/parameters/AmountFilter"
        - $ref: "#/components/parameters/Keyword"
        - $ref: "#/components/parameters/MaxTime"
        - $ref: "#/components/parameters/MinTime"
      responses:
        "200":
          description: CSV file download
          content:
            text/csv:
              schema:
                type: string

  /api/v1/data/export.tsv:
    get:
      tags: [Data Management]
      summary: Export data as TSV
      parameters:
        - $ref: "#/components/parameters/TransactionTypeFilter"
        - $ref: "#/components/parameters/CategoryIds"
        - $ref: "#/components/parameters/AccountIds"
        - $ref: "#/components/parameters/TagFilter"
        - $ref: "#/components/parameters/AmountFilter"
        - $ref: "#/components/parameters/Keyword"
        - $ref: "#/components/parameters/MaxTime"
        - $ref: "#/components/parameters/MinTime"
      responses:
        "200":
          description: TSV file download
          content:
            text/tab-separated-values:
              schema:
                type: string

  # ====================================================================
  #  Accounts
  # ====================================================================
  /api/v1/accounts/list.json:
    get:
      tags: [Accounts]
      summary: List all accounts
      parameters:
        - name: visible_only
          in: query
          schema:
            type: boolean
          description: Only return visible (non-hidden) accounts
      responses:
        "200":
          description: Account list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      result:
                        type: array
                        items:
                          $ref: "#/components/schemas/AccountInfoResponse"

  /api/v1/accounts/get.json:
    get:
      tags: [Accounts]
      summary: Get a single account
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
          description: Account ID (passed as string)
      responses:
        "200":
          description: Account details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      result:
                        $ref: "#/components/schemas/AccountInfoResponse"

  /api/v1/accounts/add.json:
    post:
      tags: [Accounts]
      summary: Create a new account
      description: Create a new account, optionally with sub-accounts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountCreateRequest"
      responses:
        "200":
          description: Account created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      result:
                        $ref: "#/components/schemas/AccountInfoResponse"

  /api/v1/accounts/modify.json:
    post:
      tags: [Accounts]
      summary: Modify an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountModifyRequest"
      responses:
        "200":
          description: Account modified
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      result:
                        $ref: "#/components/schemas/AccountInfoResponse"

  /api/v1/accounts/hide.json:
    post:
      tags: [Accounts]
      summary: Hide/unhide an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
