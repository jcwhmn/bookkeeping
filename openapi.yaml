  # ====================================================================
  #  MCP (Model Context Protocol) - JSON-RPC 2.0 endpoint
  # ====================================================================
  /mcp:
    post:
      tags: [MCP]
      summary: MCP JSON-RPC endpoint
      description: |
        Model Context Protocol server endpoint using JSON-RPC 2.0.
        Requires MCP token in `Authorization: Bearer <mcp_token>` header.

        Supported methods:
        - `initialize` — Initialize MCP session
        - `resources/list` — List available resources
        - `resources/read` — Read a specific resource
        - `tools/list` — List available tools
        - `tools/call` — Call a tool
        - `ping` — Health ping
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JSONRPCRequest"
      responses:
        "200":
          description: JSON-RPC response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JSONRPCResponse"
        "202":
          description: Notification received (no response expected)

# ====================================================================
#  Components
# ====================================================================
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT token obtained from `/api/authorize.json` login or `/api/v1/tokens/refresh.json`.
        Also supports API and MCP tokens generated via `/api/v1/tokens/generate/api.json` or `/api/v1/tokens/generate/mcp.json`.

  parameters:
    TransactionTypeFilter:
      name: type
      in: query
      schema:
        type: integer
        minimum: 0
        maximum: 4
      description: Transaction type filter (0=all, 1=modify balance, 2=income, 3=expense, 4=transfer)
    CategoryIds:
      name: category_ids
      in: query
      schema:
        type: string
      description: Comma-separated category IDs
    AccountIds:
      name: account_ids
      in: query
      schema:
        type: string
      description: Comma-separated account IDs
    TagFilter:
      name: tag_filter
      in: query
      schema:
        type: string
      description: Tag filter expression (e.g., `0:1,2;1:3` for "has any of [1,2]" + "has all of [3]", or `none` for "no tag")
    AmountFilter:
      name: amount_filter
      in: query
      schema:
        type: string
      description: Amount filter expression
    Keyword:
      name: keyword
      in: query
      schema:
        type: string
      description: Search keyword for comments
    MaxTime:
      name: max_time
      in: query
      schema:
        type: integer
        format: int64
        minimum: 0
      description: Maximum transaction time (Unix timestamp in seconds)
    MinTime:
      name: min_time
      in: query
      schema:
        type: integer
        format: int64
        minimum: 0
      description: Minimum transaction time (Unix timestamp in seconds)

  schemas:
    # ==== Generic ====
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          enum: [true]
        result:
          description: Response data (varies by endpoint)

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          enum: [false]
        errorCode:
          type: integer
          format: int32
          description: Error code (see error code format in API description)
        errorMessage:
          type: string
          description: Human-readable error message
        path:
          type: string
          description: Request path
        context:
          description: Optional context data for the error

    # ==== Auth ====
    UserLoginRequest:
      type: object
      required: [loginName, password]
      properties:
        loginName:
          type: string
          maxLength: 100
          description: Username or email
        password:
          type: string
          minLength: 6
          maxLength: 128

    AuthResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT token
        need2FA:
          type: boolean
          description: Whether 2FA is required to complete login
        user:
          $ref: "#/components/schemas/UserBasicInfo"
        applicationCloudSettings:
          $ref: "#/components/schemas/ApplicationCloudSettingSlice"
        notificationContent:
          type: string

    UserRegisterRequest:
      type: object
      required: [username, email, nickname, password, language, defaultCurrency]
      properties:
        username:
          type: string
          maxLength: 32
        email:
          type: string
          format: email
          maxLength: 100
        nickname:
          type: string
          maxLength: 64
        password:
          type: string
          minLength: 6
          maxLength: 128
        language:
          type: string
          minLength: 2
          maxLength: 16
        defaultCurrency:
          type: string
          minLength: 3
          maxLength: 3
          description: ISO 4217 currency code
        firstDayOfWeek:
          type: integer
          minimum: 0
          maximum: 6
          description: First day of week (0=Sunday, 1=Monday, etc.)
        categories:
          type: array
          description: Preset categories to create with registration
          items:
            $ref: "#/components/schemas/TransactionCategoryCreateWithSubCategories"

    RegisterResponse:
      allOf:
        - $ref: "#/components/schemas/AuthResponse"
        - type: object
          properties:
            needVerifyEmail:
              type: boolean
            presetCategoriesSaved:
              type: boolean

    # ==== Users ====
    UserBasicInfo:
      type: object
      properties:
        username:
          type: string
        email:
          type: string
        nickname:
          type: string
        avatar:
          type: string
          description: Avatar URL
        avatarProvider:
          type: string
        defaultAccountId:
          type: string
        transactionEditScope:
          type: integer
          description: Scope in which transactions can be edited (0=none, 1=all, 2=today+, 3=last24h+, 4=this week+, 5=this month+, 6=this year+)
        language:
          type: string
        defaultCurrency:
          type: string
        firstDayOfWeek:
          type: integer
        fiscalYearStart:
          type: integer
        calendarDisplayType:
          type: integer
        dateDisplayType:
          type: integer
        longDateFormat:
          type: integer
        shortDateFormat:
          type: integer
        longTimeFormat:
          type: integer
        shortTimeFormat:
          type: integer
        fiscalYearFormat:
          type: integer
        currencyDisplayType:
          type: integer
        numeralSystem:
          type: integer
        decimalSeparator:
          type: integer
        digitGroupingSymbol:
          type: integer
        digitGrouping:
          type: integer
        coordinateDisplayType:
          type: integer
        expenseAmountColor:
          type: integer
        incomeAmountColor:
          type: integer
        emailVerified:
          type: boolean

    UserProfileResponse:
      allOf:
        - $ref: "#/components/schemas/UserBasicInfo"
        - type: object
          properties:
            noPassword:
              type: boolean
            lastLoginAt:
              type: integer
              format: int64

    UserProfileUpdateRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 100
        nickname:
          type: string
          maxLength: 64
        password:
          type: string
          minLength: 6
          maxLength: 128
          description: New password (requires oldPassword)
        oldPassword:
          type: string
          minLength: 6
          maxLength: 128
        defaultAccountId:
          type: string
        transactionEditScope:
          type: integer
          minimum: 0
          maximum: 6
        language:
          type: string
          minLength: 2
          maxLength: 16
        defaultCurrency:
          type: string
          minLength: 3
          maxLength: 3
        firstDayOfWeek:
          type: integer
          minimum: 0
          maximum: 6
        fiscalYearStart:
          type: integer
        calendarDisplayType:
          type: integer
          minimum: 0
          maximum: 4
        dateDisplayType:
          type: integer
          minimum: 0
          maximum: 3
        longDateFormat:
          type: integer
          minimum: 0
          maximum: 3
        shortDateFormat:
          type: integer
          minimum: 0
          maximum: 3
        longTimeFormat:
          type: integer
          minimum: 0
          maximum: 3
        shortTimeFormat:
          type: integer
          minimum: 0
          maximum: 3
        fiscalYearFormat:
          type: integer
          minimum: 0
          maximum: 5
        currencyDisplayType:
          type: integer
          minimum: 0
          maximum: 11
        numeralSystem:
          type: integer
          minimum: 0
          maximum: 5
        decimalSeparator:
          type: integer
          minimum: 0
          maximum: 3
        digitGroupingSymbol:
          type: integer
          minimum: 0
          maximum: 4
        digitGrouping:
          type: integer
          minimum: 0
          maximum: 3
        coordinateDisplayType:
          type: integer
          minimum: 0
          maximum: 6
        expenseAmountColor:
          type: integer
          minimum: 0
          maximum: 4
        incomeAmountColor:
          type: integer
          minimum: 0
          maximum: 4

    UserProfileUpdateResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/UserBasicInfo"
        newToken:
          type: string

    # ==== Email Verification ====
    UserVerifyEmailRequest:
      type: object
      properties:
        requestNewToken:
          type: boolean

    UserVerifyEmailResponse:
      type: object
      properties:
        newToken:
          type: string
        user:
          $ref: "#/components/schemas/UserBasicInfo"
        notificationContent:
          type: string

    UserResendVerifyEmailRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 100
        password:
          type: string
          minLength: 6
          maxLength: 128

    # ==== Password Reset ====
    ForgetPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 100

    PasswordResetRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 100
        password:
          type: string
          minLength: 6
          maxLength: 128

    # ==== 2FA ====
    TwoFactorLoginRequest:
      type: object
      required: [passcode]
      properties:
        passcode:
          type: string
          minLength: 6
          maxLength: 6
          description: TOTP passcode

    TwoFactorRecoveryCodeLoginRequest:
      type: object
      required: [recoveryCode]
      properties:
        recoveryCode:
          type: string
          minLength: 11
          maxLength: 11

    TwoFactorEnableConfirmRequest:
      type: object
      required: [secret, passcode]
      properties:
        secret:
          type: string
          minLength: 32
          maxLength: 32
          description: TOTP secret
        passcode:
          type: string
          minLength: 6
          maxLength: 6

    TwoFactorEnableResponse:
      type: object
      properties:
        secret:
          type: string
          description: TOTP secret
        qrcode:
          type: string
          description: QR code data URI for setup

    TwoFactorEnableConfirmResponse:
      type: object
      properties:
        token:
          type: string
        recoveryCodes:
          type: array
          items:
            type: string

    TwoFactorDisableRequest:
      type: object
      properties:
        password:
          type: string
          minLength: 6
          maxLength: 128

    TwoFactorRegenerateRecoveryCodeRequest:
      type: object
      properties:
        password:
          type: string
          minLength: 6
          maxLength: 128

    TwoFactorStatusResponse:
      type: object
      properties:
        enable:
          type: boolean
        createdAt:
          type: integer
          format: int64

    # ==== OAuth2 ====
    OAuth2CallbackLoginRequest:
      type: object
      properties:
        password:
          type: string
          minLength: 6
          maxLength: 128
        passcode:
          type: string
          minLength: 6
          maxLength: 6
        token:
          type: string

    # ==== External Auth ====
    UserExternalAuthUnlinkRequest:
      type: object
      required: [externalAuthType, password]
      properties:
        externalAuthType:
          type: string
        password:
          type: string
          minLength: 6
          maxLength: 128

    UserExternalAuthInfoResponse:
      type: object
      properties:
        externalAuthCategory:
          type: string
        externalAuthType:
          type: string
        linked:
          type: boolean
        externalUsername:
          type: string
        createdAt:
          type: integer
          format: int64

    UserExternalAuthInfoResponsesSlice:
      type: array
      items:
        $ref: "#/components/schemas/UserExternalAuthInfoResponse"

    # ==== Tokens ====
    TokenGenerateAPIRequest:
      type: object
      properties:
        expiresInSeconds:
          type: integer
          format: int64
          minimum: 0
          maximum: 4294967295
        password:
          type: string
          minLength: 6
          maxLength: 128

    TokenGenerateMCPRequest:
      type: object
      properties:
        expiresInSeconds:
          type: integer
          format: int64
          minimum: 0
          maximum: 4294967295
        password:
          type: string
          minLength: 6
          maxLength: 128

    TokenRevokeRequest:
      type: object
      required: [tokenId]
      properties:
        tokenId:
          type: string

    TokenGenerateAPIResponse:
      type: object
      properties:
        token:
          type: string
