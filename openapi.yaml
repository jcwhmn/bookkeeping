          type: string
        settingValue:
          type: string

    ApplicationCloudSettingSlice:
      type: array
      items:
        $ref: "#/components/schemas/ApplicationCloudSetting"

    UserApplicationCloudSettingsUpdateRequest:
      type: object
      properties:
        settings:
          $ref: "#/components/schemas/ApplicationCloudSettingSlice"
        fullUpdate:
          type: boolean
          description: If true, replaces all settings; if false, merges

    # ==== Import ====
    ImportTransactionResponse:
      type: object
      properties:
        type:
          type: integer
        categoryId:
          type: string
        originalCategoryName:
          type: string
        time:
          type: integer
          format: int64
        utcOffset:
          type: integer
        sourceAccountId:
          type: string
        originalSourceAccountName:
          type: string
        originalSourceAccountCurrency:
          type: string
        destinationAccountId:
          type: string
        originalDestinationAccountName:
          type: string
        originalDestinationAccountCurrency:
          type: string
        sourceAmount:
          type: integer
          format: int64
        destinationAmount:
          type: integer
          format: int64
        tagIds:
          type: array
          items:
            type: string
        originalTagNames:
          type: array
          items:
            type: string
        comment:
          type: string
        geoLocation:
          $ref: "#/components/schemas/TransactionGeoLocationResponse"

    ImportTransactionResponsePageWrapper:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ImportTransactionResponse"
        totalCount:
          type: integer
          format: int64

    # ==== MCP / JSON-RPC ====
    JSONRPCRequest:
      type: object
      required: [jsonrpc, method]
      properties:
        jsonrpc:
          type: string
          enum: ["2.0"]
        method:
          type: string
          description: MCP method name (e.g., initialize, tools/list, tools/call)
        params:
          description: Method parameters (varies by method)
        id:
          description: Request ID (string or number)

    JSONRPCResponse:
      type: object
      required: [jsonrpc, id]
      properties:
        jsonrpc:
          type: string
          enum: ["2.0"]
        result:
          description: Method result (varies by method)
        error:
          $ref: "#/components/schemas/JSONRPCError"
        id:
          description: Request ID matching the request

    JSONRPCError:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          description: Error code (-32700=parse, -32601=method not found, -32602=invalid params, -32603=internal)
        message:
          type: string
        data:
          description: Optional error details
