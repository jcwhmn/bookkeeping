      properties:
        currency:
          type: string
          minLength: 3
          maxLength: 3
          description: ISO 4217 currency code
        rate:
          type: string
          description: Exchange rate as string

    UserCustomExchangeRateDeleteRequest:
      type: object
      required: [currency]
      properties:
        currency:
          type: string
          minLength: 3
          maxLength: 3

    UserCustomExchangeRateUpdateResponse:
      type: object
      properties:
        currency:
          type: string
        rate:
          type: string
        updateTime:
          type: integer
          format: int64

    LatestExchangeRateResponse:
      type: object
      properties:
        dataSource:
          type: string
        referenceUrl:
          type: string
        updateTime:
          type: integer
          format: int64
        baseCurrency:
          type: string
        exchangeRates:
          type: array
          items:
            type: object
            properties:
              currency:
                type: string
              rate:
                type: string

    # ==== Application Cloud Settings ====
    ApplicationCloudSetting:
      type: object
      properties:
