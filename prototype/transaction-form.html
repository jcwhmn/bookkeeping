
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Transaction</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
      background: rgba(0, 0, 0, 0.5);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal {
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
      width: 100%;
      max-width: 480px;
      max-height: 90vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid #E0E0E0;
    }

    .back-btn, .close-btn {
      width: 40px;
      height: 40px;
      border: none;
      background: transparent;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #666;
      transition: background 0.2s;
    }

    .back-btn:hover, .close-btn:hover {
      background: #F5F5F5;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 500;
      color: #111;
    }

    .type-selector {
      display: flex;
      gap: 8px;
      padding: 20px;
      background: #FAFAFA;
    }

    .type-btn {
      flex: 1;
      height: 48px;
      border: 2px solid;
      border-radius: 8px;
      background: white;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .type-btn.expense {
      border-color: #F44336;
      color: #F44336;
    }

    .type-btn.expense.active {
      background: #F44336;
      color: white;
    }

    .type-btn.income {
      border-color: #4CAF50;
      color: #4CAF50;
    }

    .type-btn.income.active {
      background: #4CAF50;
      color: white;
    }

    .type-btn.transfer {
      border-color: #2196F3;
      color: #2196F3;
    }

    .type-btn.transfer.active {
      background: #2196F3;
      color: white;
    }

    .form-content {
      padding: 20px;
      overflow-y: auto;
      flex: 1;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: #666;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .amount-input-wrapper {
      display: flex;
      align-items: center;
      background: #F5F5F5;
      border: 2px solid transparent;
      border-radius: 8px;
      padding: 0 16px;
      height: 64px;
      transition: border-color 0.2s;
    }

    .amount-input-wrapper:focus-within {
      border-color: #1976D2;
      background: white;
    }

    .amount-input-wrapper.error {
      border-color: #F44336;
    }

    .currency-prefix {
      font-size: 32px;
      font-weight: 500;
      color: #666;
      margin-right: 8px;
    }

    .amount-input {
      flex: 1;
      border: none;
      background: transparent;
      font-size: 32px;
      font-weight: 500;
      color: #111;
      text-align: right;
      font-variant-numeric: tabular-nums;
      outline: none;
    }

    .amount-input::placeholder {
      color: #BDBDBD;
    }

    .select-wrapper {
      position: relative;
    }

    .select-input {
      width: 100%;
      height: 48px;
      padding: 0 40px 0 12px;
      border: 1px solid #E0E0E0;
      border-radius: 8px;
      background: white;
      font-size: 16px;
      color: #111;
      cursor: pointer;
      appearance: none;
      transition: border-color 0.2s;
    }

    .select-input:focus {
      outline: none;
      border-color: #1976D2;
    }

    .select-input.error {
      border-color: #F44336;
    }

    .select-icon {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: #666;
    }

    .date-input-wrapper {
      display: flex;
      gap: 8px;
    }

    .date-input {
      flex: 1;
      height: 48px;
      padding: 0 12px;
      border: 1px solid #E0E0E0;
      border-radius: 8px;
      background: white;
      font-size: 16px;
      color: #111;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .date-input:focus {
      outline: none;
      border-color: #1976D2;
    }

    .quick-date-btn {
      height: 48px;
      padding: 0 16px;
      border: 1px solid #E0E0E0;
      border-radius: 8px;
      background: white;
      font-size: 14px;
      font-weight: 500;
      color: #1976D2;
      cursor: pointer;
      transition: all 0.2s;
    }

    .quick-date-btn:hover {
      background: #E3F2FD;
    }

    .notes-input {
      width: 100%;
      min-height: 72px;
      padding: 12px;
      border: 1px solid #E0E0E0;
      border-radius: 8px;
      background: white;
      font-size: 16px;
      color: #111;
      resize: vertical;
      font-family: inherit;
      transition: border-color 0.2s;
    }

    .notes-input:focus {
      outline: none;
      border-color: #1976D2;
    }

    .notes-input::placeholder {
      color: #9E9E9E;
    }

    .tags-container {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 12px;
      border: 1px solid #E0E0E0;
      border-radius: 8px;
      background: white;
      min-height: 48px;
      cursor: text;
    }

    .tags-container:focus-within {
      border-color: #1976D2;
    }

    .tag {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 6px 12px;
      background: #E3F2FD;
      border-radius: 16px;
      font-size: 14px;
      color: #1976D2;
    }

    .tag-remove {
      width: 16px;
      height: 16px;
      border: none;
      background: transparent;
      color: #1976D2;
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tag-remove:hover {
      color: #1565C0;
    }

    .add-tag-btn {
      height: 32px;
      padding: 0 12px;
      border: 1px dashed #BDBDBD;
      border-radius: 16px;
      background: transparent;
      font-size: 14px;
      color: #666;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .add-tag-btn:hover {
      border-color: #1976D2;
      color: #1976D2;
    }

    .tag-input {
      border: none;
      background: transparent;
      font-size: 14px;
      color: #111;
      outline: none;
      min-width: 80px;
    }

    .error-message {
      display: none;
      font-size: 12px;
      color: #F44336;
      margin-top: 4px;
    }

    .form-group.has-error .error-message {
      display: block;
    }

    .transfer-fields {
      display: none;
    }

    .transfer-fields.visible {
      display: block;
    }

    .transfer-arrow {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px 0;
      color: #2196F3;
      font-size: 20px;
    }

    .modal-footer {
      padding: 16px 20px;
      border-top: 1px solid #E0E0E0;
      background: white;
    }

    @media (max-width: 480px) {
      .modal-footer {
        position: sticky;
        bottom: 0;
        box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.1);
      }
    }

    .action-buttons {
      display: flex;
      gap: 12px;
    }

    .cancel-btn {
      height: 48px;
      padding: 0 24px;
      border: none;
      background: transparent;
      font-size: 14px;
      font-weight: 500;
      color: #666;
      cursor: pointer;
      border-radius: 8px;
    }

    .cancel-btn:hover {
      background: #F5F5F5;
    }

    .save-btn {
      flex: 1;
      height: 48px;
      border: none;
      background: #1976D2;
      color: white;
      font-size: 14px;
      font-weight: 500;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .save-btn:hover:not(:disabled) {
      background: #1565C0;
    }

    .save-btn:disabled {
      background: #BDBDBD;
      cursor: not-allowed;
    }

    .icon {
      width: 20px;
      height: 20px;
    }
  </style>
</head>
<body>
  <div class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <button class="back-btn" aria-label="Back">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M15 18l-6-6 6-6"/>
          </svg>
        </button>
        <h1 class="modal-title">Add Transaction</h1>
        <button class="close-btn" aria-label="Close">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 6L6 18M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <div class="type-selector">
        <button class="type-btn expense active" data-type="expense">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2v20M17 7l-5-5-5 5"/>
          </svg>
          Expense
        </button>
        <button class="type-btn income" data-type="income">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 22V2M7 17l5 5 5-5"/>
          </svg>
          Income
        </button>
        <button class="type-btn transfer" data-type="transfer">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M7 16l4-4-4-4M17 8l-4 4 4 4M3 12h18"/>
          </svg>
          Transfer
        </button>
      </div>

      <div class="form-content">
        <div class="form-group">
          <label class="form-label">Amount</label>
          <div class="amount-input-wrapper">
            <span class="currency-prefix">$</span>
            <input type="text" class="amount-input" placeholder="0.00" inputmode="decimal" value="42.50">
          </div>
          <span class="error-message">Please enter a valid amount</span>
        </div>

        <div class="form-group">
          <label class="form-label">From Account</label>
          <div class="select-wrapper">
            <select class="select-input">
              <option value="chase-checking" selected>💵 Chase Checking — $2,847.50</option>
              <option value="ally-savings">🏦 Ally Savings — $12,450.00</option>
              <option value="amex-gold">💳 Amex Gold — -$342.18</option>
              <option value="capital-one">🏛️ Capital One 360 — $5,200.00</option>
              <option value="fidelity">📈 Fidelity Brokerage — $18,920.45</option>
              <option value="venmo">📱 Venmo — $125.00</option>
            </select>
            <svg class="select-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M6 9l6 6 6-6"/>
            </svg>
          </div>
        </div>

        <div class="form-group category-group">
          <label class="form-label">Category</label>
          <div class="select-wrapper">
            <select class="select-input">
              <option value="">Select category</option>
              <optgroup label="Food & Dining">
                <option value="food-groceries" selected>🍔 Food — Groceries</option>
                <option value="food-restaurants">🍽️ Food — Restaurants</option>
                <option value="food-coffee">☕ Food — Coffee</option>
                <option value="food-delivery">📦 Food — Delivery</option>
              </optgroup>
              <optgroup label="Transportation">
                <option value="trans-gas">⛽ Transportation — Gas</option>
                <option value="trans-parking">🅿️ Transportation — Parking</option>
                <option value="trans-rideshare">🚗 Transportation — Rideshare</option>
                <option value="trans-transit">🚇 Transportation — Transit</option>
              </optgroup>
              <optgroup label="Shopping">
                <option value="shop-clothing">👕 Shopping — Clothing</option>
                <option value="shop-electronics">📱 Shopping — Electronics</option>
                <option value="shop-home">🏠 Shopping — Home Goods</option>
              </optgroup>
              <optgroup label="Bills & Utilities">
                <option value="bills-rent">🏠 Bills — Rent</option>
                <option value="bills-utilities">💡 Bills — Utilities</option>
                <option value="bills-internet">📶 Bills — Internet</option>
                <option value="bills-phone">📞 Bills — Phone</option>
              </optgroup>
              <optgroup label="Entertainment">
                <option value="ent-streaming">📺 Entertainment — Streaming</option>
                <option value="ent-games">🎮 Entertainment — Games</option>
                <option value="ent-events">🎭 Entertainment — Events</option>
              </optgroup>
              <optgroup label="Income">
                <option value="inc-salary">💼 Income — Salary</option>
                <option value="inc-freelance">💻 Income — Freelance</option>
                <option value="inc-investments">📈 Income — Investments</option>
                <option value="inc-refunds">🔄 Income — Refunds</option>
              </optgroup>
            </select>
            <svg class="select-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M6 9l6 6 6-6"/>
            </svg>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Date</label>
          <div class="date-input-wrapper">
            <input type="date" class="date-input" value="2026-05-19">
            <button class="quick-date-btn" data-date="today">Today</button>
            <button class="quick-date-btn" data-date="yesterday">Yesterday</button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Notes</label>
          <textarea class="notes-input" placeholder="Add notes...">Weekly grocery run at Trader Joe's</textarea>
        </div>

        <div class="form-group">
          <label class="form-label">Tags</label>
          <div class="tags-container" tabindex="0">
            <span class="tag">
              food
              <button class="tag-remove" aria-label="Remove tag">×</button>
            </span>
            <span class="tag">
              groceries
              <button class="tag-remove" aria-label="Remove tag">×</button>
            </span>
            <button class="add-tag-btn">+ Add tag</button>
            <input type="text" class="tag-input" placeholder="Add tag...">
          </div>
        </div>

        <div class="transfer-fields">
          <div class="transfer-arrow">↓</div>
          <div class="form-group">
            <label class="form-label">To Account</label>
            <div class="select-wrapper">
              <select class="select-input">
                <option value="">Select account</option>
                <option value="chase-checking">💵 Chase Checking — $2,847.50</option>
                <option value="ally-savings">🏦 Ally Savings — $12,450.00</option>
                <option value="amex-gold">💳 Amex Gold — -$342.18</option>
                <option value="capital-one">🏛️ Capital One 360 — $5,200.00</option>
                <option value="fidelity">📈 Fidelity Brokerage — $18,920.45</option>
                <option value="venmo">📱 Venmo — $125.00</option>
              </select>
              <svg class="select-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M6 9l6 6 6-6"/>
              </svg>
            </div>
          </div>
        </div>
      </div>

      <div class="modal-footer">
        <div class="action-buttons">
          <button class="cancel-btn">Cancel</button>
          <button class="save-btn">Save Transaction</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const typeButtons = document.querySelectorAll('.type-btn');
    const categoryGroup = document.querySelector('.category-group');
    const transferFields = document.querySelector('.transfer-fields');

    typeButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        typeButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const type = btn.dataset.type;

        if (type === 'transfer') {
          categoryGroup.style.display = 'none';
          transferFields.classList.add('visible');
        } else {
          categoryGroup.style.display = 'block';
          transferFields.classList.remove('visible');
        }

        const saveBtn = document.querySelector('.save-btn');
        saveBtn.textContent = type === 'transfer' ? 'Transfer Funds' : 'Save Transaction';
      });
    });

    const quickDateBtns = document.querySelectorAll('.quick-date-btn');
    const dateInput = document.querySelector('.date-input');

    quickDateBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const type = btn.dataset.date;
        const today = new Date();

        if (type === 'today') {
          dateInput.value = today.toISOString().split('T')[0];
        } else if (type === 'yesterday') {
          const yesterday = new Date(today);
          yesterday.setDate(yesterday.getDate() - 1);
          dateInput.value = yesterday.toISOString().split('T')[0];
        }
      });
    });

    const amountInput = document.querySelector('.amount-input');

    amountInput.addEventListener('blur', () => {
      const value = parseFloat(amountInput.value);
      if (!isNaN(value)) {
        amountInput.value = value.toFixed(2);
      }
    });

    const tagsContainer = document.querySelector('.tags-container');
    const tagInput = document.querySelector('.tag-input');
    const addTagBtn = document.querySelector('.add-tag-btn');

    tagInput.style.display = 'none';

    addTagBtn.addEventListener('click', () => {
      tagInput.style.display = 'block';
      tagInput.focus();
      addTagBtn.style.display = 'none';
    });

    tagInput.addEventListener('blur', () => {
      if (tagInput.value.trim()) {
        createTag(tagInput.value.trim());
        tagInput.value = '';
      }
      tagInput.style.display = 'none';
      addTagBtn.style.display = 'flex';
    });

    tagInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        if (tagInput.value.trim()) {
          createTag(tagInput.value.trim());
          tagInput.value = '';
        }
      }
    });

    function createTag(name) {
      const tag = document.createElement('span');
      tag.className = 'tag';
      tag.innerHTML = `${name}<button class="tag-remove" aria-label="Remove tag">×</button>`;

      tag.querySelector('.tag-remove').addEventListener('click', () => {
        tag.remove();
      });

      tagsContainer.insertBefore(tag, addTagBtn);
    }

    document.querySelectorAll('.tag-remove').forEach(btn => {
      btn.addEventListener('click', () => {
        btn.parentElement.remove();
      });
    });
  </script>
</body>
</html>
