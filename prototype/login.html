<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookkeeping — Sign In</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --primary: #1976D2;
      --primary-hover: #1565C0;
      --primary-pressed: #0D47A1;
      --bg: #FAFAFA;
      --card: #FFFFFF;
      --text: #333333;
      --text-muted: #666666;
      --border: #E0E0E0;
      --border-focus: #1976D2;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.1);
      --radius: 8px;
      --input-height: 48px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background-color: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .login-card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 40px 32px;
      width: 100%;
      max-width: 400px;
    }

    .logo-section {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo {
      width: 56px;
      height: 56px;
      margin: 0 auto 16px;
      background: var(--primary);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo svg {
      width: 32px;
      height: 32px;
      fill: white;
    }

    .app-name {
      font-size: 24px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.01em;
    }

    .subtitle {
      font-size: 14px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .input-wrapper {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 20px;
      height: 20px;
      color: var(--text-muted);
      pointer-events: none;
    }

    .input-wrapper input {
      width: 100%;
      height: var(--input-height);
      padding: 0 14px 0 44px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 16px;
      color: var(--text);
      background: var(--card);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .input-wrapper input::placeholder {
      color: var(--text-muted);
    }

    .input-wrapper input:focus {
      outline: none;
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(25, 118, 210, 0.12);
    }

    .password-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 32px;
      height: 32px;
      border: none;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      border-radius: 50%;
      transition: background-color 0.15s ease;
    }

    .password-toggle:hover {
      background: rgba(0, 0, 0, 0.04);
    }

    .password-toggle:active {
      background: rgba(0, 0, 0, 0.08);
    }

    .password-toggle svg {
      width: 20px;
      height: 20px;
    }

    .password-wrapper {
      position: relative;
    }

    .password-wrapper input {
      padding-right: 44px;
    }

    .btn-primary {
      width: 100%;
      height: var(--input-height);
      background: var(--primary);
      color: white;
      border: none;
      border-radius: var(--radius);
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.15s ease, transform 0.1s ease;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-primary:active {
      background: var(--primary-pressed);
      transform: scale(0.99);
    }

    .btn-primary:focus {
      outline: none;
      box-shadow: 0 0 0 3px rgba(25, 118, 210, 0.24);
    }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 24px 0;
    }

    .create-account {
      text-align: center;
    }

    .create-account p {
      font-size: 14px;
      color: var(--text-muted);
    }

    .create-account a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
    }

    .create-account a:hover {
      text-decoration: underline;
    }

    .footer {
      margin-top: 32px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .language-selector {
      display: flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 12px;
      cursor: pointer;
      background: transparent;
      font-size: 13px;
      color: var(--text-muted);
      transition: border-color 0.15s ease;
    }

    .language-selector:hover {
      border-color: var(--text-muted);
    }

    .language-selector svg {
      width: 16px;
      height: 16px;
    }

    .copyright {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* Mobile optimizations */
    @media (max-width: 480px) {
      body {
        padding: 0;
        align-items: flex-start;
      }

      .login-card {
        max-width: 100%;
        border-radius: 0;
        box-shadow: none;
        padding: 24px 20px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .logo-section {
        margin-bottom: 24px;
      }

      .form-group {
        margin-bottom: 16px;
      }

      .btn-primary {
        height: 50px;
      }

      .footer {
        margin-top: auto;
      }
    }

    /* Tablet/larger phone */
    @media (min-width: 481px) and (max-width: 768px) {
      .login-card {
        padding: 48px 40px;
      }
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="logo-section">
      <div class="logo">
        <!-- Book/ledger icon -->
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M19 3H5C3.9 3 3 3.9 3 5V19C3 20.1 3.9 21 5 21H19C20.1 21 21 20.1 21 19V5C21 3.9 20.1 3 19 3ZM19 19H5V5H19V19Z"/>
          <path d="M7 7H17V9H7V7ZM7 11H17V13H7V11ZM7 15H13V17H7V15Z"/>
        </svg>
      </div>
      <h1 class="app-name">Bookkeeping</h1>
      <p class="subtitle">Sign in to your account</p>
    </div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <div class="input-wrapper">
          <!-- User icon -->
          <svg class="input-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
          </svg>
          <input 
            type="text" 
            id="username" 
            name="username" 
            placeholder="Username"
            autocomplete="username"
            required
          >
        </div>
      </div>

      <div class="form-group">
        <div class="input-wrapper password-wrapper">
          <svg class="input-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
          </svg>
          <input 
            type="password" 
            id="password" 
            name="password" 
            placeholder="Password"
            autocomplete="current-password"
            required
          >
          <button type="button" class="password-toggle" onclick="togglePassword()" aria-label="Toggle password visibility">
            <!-- Eye icon (visible by default) -->
            <svg id="eyeIcon" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
            </svg>
            <!-- Eye off icon (hidden by default) -->
            <svg id="eyeOffIcon" style="display:none" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-primary">Sign In</button>
    </form>

    <div class="create-account">
      <p>Don't have an account? <a href="#">Create an account</a></p>
    </div>

    <div class="footer">
      <button class="language-selector" onclick="toggleLanguageMenu()">
        <!-- Globe icon -->
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
        </svg>
        <span id="currentLang">English (US)</span>
      </button>
      <span class="copyright">© 2026 Bookkeeping</span>
    </div>
  </div>

  <script>
    function togglePassword() {
      const passwordInput = document.getElementById('password');
      const eyeIcon = document.getElementById('eyeIcon');
      const eyeOffIcon = document.getElementById('eyeOffIcon');
      
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        eyeIcon.style.display = 'none';
        eyeOffIcon.style.display = 'block';
      } else {
        passwordInput.type = 'password';
        eyeIcon.style.display = 'block';
        eyeOffIcon.style.display = 'none';
      }
    }

    function handleLogin(event) {
      event.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      
      // For demo purposes - in production, this would call your auth API
      console.log('Login attempt:', { username });
      
      // Visual feedback
      const btn = event.target.querySelector('.btn-primary');
      const originalText = btn.textContent;
      btn.textContent = 'Signing in...';
      btn.disabled = true;
      
      setTimeout(() => {
        btn.textContent = originalText;
        btn.disabled = false;
        alert('Login successful! (Demo mode)');
      }, 1000);
    }

    function toggleLanguageMenu() {
      // In production, this would show a dropdown with language options
      const langs = ['English (US)', 'English (UK)', 'Español', 'Français', 'Deutsch', '日本語', '中文'];
      const current = document.getElementById('currentLang').textContent;
      const currentIndex = langs.indexOf(current);
      const nextIndex = (currentIndex + 1) % langs.length;
      document.getElementById('currentLang').textContent = langs[nextIndex];
    }
  </script>
</body>
</html>
