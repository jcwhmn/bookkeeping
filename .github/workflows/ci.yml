# =============================================================================
# Bookkeeping Monorepo CI Workflow
# Backend: Spring Boot 4 + Gradle 9.3 + Java 25
# Frontend: Nuxt 4 + pnpm
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # Backend
  BACKEND_DIR: backend
  # Frontend
  FRONTEND_DIR: frontend

jobs:
  # ===========================================================================
  # Backend: Build + Test (Unit + Integration)
  # ===========================================================================
  backend:
    name: Backend (Java 25 + Gradle)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: bookkeeping
          POSTGRES_PASSWORD: test123
          POSTGRES_DB: bookkeeping_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready -U bookkeeping
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ${{ env.BACKEND_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin
          cache: gradle

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Build & Unit Test (H2)
        run: ./gradlew test --no-daemon

      - name: Integration Test (PostgreSQL)
        run: ./gradlew integrationTest --no-daemon
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/bookkeeping_test
          SPRING_DATASOURCE_USERNAME: bookkeeping
          SPRING_DATASOURCE_PASSWORD: test123

      - name: Archive test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            ${{ env.BACKEND_DIR }}/build/reports/tests/
            ${{ env.BACKEND_DIR }}/build/test-results/

  # ===========================================================================
  # Frontend: Build
  # ===========================================================================
  frontend:
    name: Frontend (Nuxt 4 + pnpm)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ env.FRONTEND_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (Nuxt generate)
        run: pnpm generate

      - name: Lint check
        run: pnpm lint || echo "Lint not configured, skipping"

      - name: Archive build output
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: ${{ env.FRONTEND_DIR }}/.output/public/

  # ===========================================================================
  # Combined Status Check
  # ===========================================================================
  build-complete:
    name: Build Complete
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Check backend status
        run: |
          if [ "${{ needs.backend.result }}" = "success" ]; then
            echo "✅ Backend: PASSED"
          else
            echo "❌ Backend: ${{ needs.backend.result }}"
            exit 1
          fi

      - name: Check frontend status
        run: |
          if [ "${{ needs.frontend.result }}" = "success" ]; then
            echo "✅ Frontend: PASSED"
          else
            echo "❌ Frontend: ${{ needs.frontend.result }}"
            exit 1
          fi

      - name: All checks passed
        run: echo "🎉 All builds and tests passed!"
