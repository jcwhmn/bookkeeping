spring:
  application:
    name: bookkeeping
  datasource:
    url: jdbc:postgresql://localhost:5432/bookkeeping_dev
    username: bookkeeping
    password: "123456"
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:dev-secret-key-for-development-only-minimum-32-chars}
  access-token-expiry: 1800
  refresh-token-expiry: 2592000
